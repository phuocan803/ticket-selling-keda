apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ticket-selling
data:
  NODE_ENV: production
  APP_ENV: aws
  PORT: "3000"
  AWS_REGION: us-east-1
  REDIS_URL: ""
  SQS_AUTH_QUEUE_URL: ""
  SQS_CLIENT_QUEUE_URL: ""
  SQS_TICKETS_QUEUE_URL: ""
  SQS_ORDERS_SERVICE_QUEUE_URL: ""
  SQS_ORDER_EVENTS_QUEUE_URL: ""
  SQS_PAYMENT_EVENTS_QUEUE_URL: ""
  SQS_EXPIRATION_QUEUE_URL: ""
  SQS_EXPIRATION_EVENTS_QUEUE_URL: ""
  ENABLE_AUTH_WORKER: "false"
  ENABLE_CLIENT_WORKER: "false"
  ENABLE_TICKETS_WORKER: "false"
  ENABLE_ORDERS_WORKER: "false"
  ENABLE_SQS_CONSUMER: "false"
  ENABLE_EXPIRATION_WORKER: "false"
  EXPIRATION_DELAY_SECONDS: "60"
  SQS_MAX_MESSAGES: "5"
  SQS_WAIT_TIME_SECONDS: "10"
  SQS_VISIBILITY_TIMEOUT: "30"
  SQS_POLL_SLEEP_MS: "2000"
