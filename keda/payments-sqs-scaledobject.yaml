apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payments-sqs-scaler
  namespace: ticket-selling
spec:
  scaleTargetRef:
    name: payments
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: __SQS_ORDER_EVENTS_QUEUE_URL__
        awsRegion: __AWS_REGION__
        queueLength: "5"
      authenticationRef:
        name: payments-sqs-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: payments-sqs-auth
  namespace: ticket-selling
spec:
  podIdentity:
    provider: aws-eks
