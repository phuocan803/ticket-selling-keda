apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-cpu-hpa
  namespace: ticket-selling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
